<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom MP3 Player</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 320px;
            text-align: center;
        }
        .track-info {
            margin-bottom: 20px;
        }
        .track-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 4px 0;
        }
        .track-artist {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin: 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        button {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            transition: transform 0.1s ease, color 0.2s ease;
        }
        button:hover {
            color: var(--primary);
        }
        button:active {
            transform: scale(0.95);
        }
        .play-btn {
            background-color: var(--primary);
            color: var(--bg-color);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .play-btn:hover {
            color: var(--bg-color);
            transform: scale(1.05);
        }
        .progress-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .progress-bar {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
            font-size: 0.875rem;
        }
        .volume-slider {
            width: 80px;
            -webkit-appearance: none;
            appearance: none;
            background: #334155;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            background: var(--text);
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- Hidden Audio Element -->
    <audio id="audio-player"></audio>

    <!-- Custom Visual Interface -->
    <div class="player-card">
        <div class="track-info">
            <p class="track-title" id="track-title">Track Title</p>
            <p class="track-artist" id="track-artist">Artist Name</p>
        </div>

        <div class="controls">
            <!-- Previous Track -->
            <button id="prev-btn" title="Previous Track">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>

            <!-- Play/Pause -->
            <button id="play-btn" class="play-btn" title="Play">
                <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <!-- Next Track -->
            <button id="next-btn" title="Next Track">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>

        <div class="volume-container">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
    </div>

    <script>
        // EDIT YOUR PLAYLIST HERE: Replace the titles, artists, and direct .mp3 URLs with your own music files
        const playlist = [
            {
                title: "Dual Minds [#1]",
                artist: "Tomas Skydleberg",
                src: "https://videotourl.com/audio/1793601931775-192e9176-99aa-46f8-8cc0-4e5e22d9e841.mp3"
            },
            {
                title: "Hideout [#2]",
                artist: "Tomas Skydleberg",
                src: "https://videotourl.com/audio/1793602383803-4b623b54-e44f-4ff7-80c9-9196a4e5e8a6.mp3"
            },
			{	title: "Strewn Fields [#3]",
				artist: "Tomas Skydleberg",
				src: "https://videotourl.com/audio/1793602569342-f99381ff-eaa1-4ba6-beb7-3129e2494f68.mp3"
			},
			{	title: "Curiosity [#4]",
				artist: "Tomas Skydleberg",
				src: "https://videotourl.com/audio/1793602506522-bfde6f8c-6b45-4cfa-9e52-8efd03af8be6.mp3"
			},
			{	title: "Angel Falls [#5]",
				artist: "Tomas Skydleberg",
				src: "https://videotourl.com/audio/1793602667197-375db8ac-3af4-4265-910a-cdac80bb4307.mp3"
			},
			{	title: "Saturday Mornings [#6]",
				artist: "Tomas Skydleberg",
				src: "https://www.image2url.com/r2/default/audio/1793603406788-3fe1222b-f9b8-48fa-ad85-1dc2496be044.mp3"
			},
			{	title: "A Sonic Boom [#7]",
				artist: "Tomas Skydleberg",
				src: "https://videotourl.com/audio/1793603646369-4ea602b9-116b-4a57-bcc2-4121f723fba4.mp3"
			},
			{	title: "Guests of Honour [#8]",
				artist: "Tomas Skydleberg",
				src: "https://videotourl.com/audio/1793602831510-203db5a9-9fad-4bd9-9435-af86ae135ae0.mp3"
			}
        ];

        let currentTrackIndex = 0;

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeLabel = document.getElementById('current-time');
        const durationLabel = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume-slider');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');

        function loadTrack(index) {
            const track = playlist[index];
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            audio.src = track.src;
            audio.load();
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Initialize first track
        loadTrack(currentTrackIndex);

        // Toggle Play / Pause
        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        // Previous Track Button
        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        // Next Track Button
        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
        });

        // Update progress bar and time stamps
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percentage;
                currentTimeLabel.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationLabel.textContent = formatTime(audio.duration);
        });

        // Seek functionality
        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * audio.duration;
            audio.currentTime = seekTime;
        });

        // Volume control
        volumeSlider.addEventListener('input', () => {
            audio.volume = volumeSlider.value;
        });

        // Auto play next track when current ends
        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
        });
    </script>
